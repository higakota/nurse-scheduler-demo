name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install published dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Run regression tests
        run: python -B -m unittest discover -s tests
      - name: Check first-run sample initialization and home
        run: python -B -c "from demo_run import app; response=app.test_client().get('/?month=2026-11'); assert response.status_code == 200"
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-web.txt
      - run: python -m pip check
      - run: python -B -m unittest discover -s tests -p test_web_demo.py
      - run: python -B tools/check_web_deploy.py
