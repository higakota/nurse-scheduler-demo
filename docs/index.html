<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>勤務表作成の操作デモ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f6f4;color:#183d34;font-family:"Yu Gothic",Meiryo,sans-serif}
main{max-width:1160px;margin:auto;padding:40px 24px}header{margin-bottom:24px}header small{color:#58756b}h1{font-size:clamp(23px,4vw,32px);margin:8px 0}p{line-height:1.8;color:#52685f}
.player{position:relative;background:#173d34;border:1px solid #cadbd3;border-radius:18px;overflow:hidden;box-shadow:0 12px 36px #173d3418}
video{display:block;width:100%;height:auto;max-height:78vh;aspect-ratio:1280/944;background:#173d34}
.play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:108px;height:108px;border-radius:50%;border:3px solid #206c5b;background:#fffffff2;cursor:pointer;box-shadow:0 4px 20px #0003}
.play:before{content:"";display:block;width:0;height:0;border-top:24px solid transparent;border-bottom:24px solid transparent;border-left:38px solid #206c5b;margin-left:32px}
.play:hover{background:white;box-shadow:0 5px 28px #0005}.play:focus-visible{outline:4px solid #e7b34d;outline-offset:5px}.play[hidden]{display:none}
.video-surface{position:relative}

.player-settings{position:absolute;bottom:0;left:0;right:0;padding:24px 14px 8px;background:linear-gradient(transparent,#000c);color:white;z-index:4}
.control-row{display:flex;align-items:center;gap:10px;height:40px}
.control-row button{border:0;background:transparent;color:white;cursor:pointer;min-width:36px;height:36px;border-radius:5px;font-size:22px;display:grid;place-items:center}
.control-row button:hover{background:#fff2}.control-row button:focus-visible,input:focus-visible{outline:3px solid #e7b34d}
.control-spacer{flex:1}.timestamp{font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}.volume{width:70px}.seek{display:block;width:100%;height:12px;accent-color:#ef4259;cursor:pointer}.volume{accent-color:white}
.player:fullscreen{display:flex;align-items:center;justify-content:center;background:black;border:0;border-radius:0}
.player:fullscreen .video-surface{width:100%;height:100%}.player:fullscreen video{width:100%;height:100%;max-height:none;object-fit:contain}
.player.is-playing:not(:hover):not(:focus-within) .player-settings:not(:has(.settings-panel:not([hidden]))){opacity:0;transition:opacity .3s}
@media(max-width:600px){.volume{display:none}.control-row{gap:4px}.timestamp{font-size:11px}}

.settings-button{display:flex;align-items:center;gap:7px;font:inherit;font-size:14px;color:white;background:transparent;border:0;border-radius:6px;padding:8px 12px;cursor:pointer}
.settings-button:hover,.settings-button[aria-expanded=true]{background:#ffffff20}
.settings-button:focus-visible,.settings-panel button:focus-visible{outline:3px solid #e7b34d;outline-offset:-3px}
.settings-panel{position:absolute;z-index:5;bottom:76px;right:10px;width:230px;max-height:65vh;overflow-y:auto;border-radius:10px;background:#182722f5;color:white;padding:8px;box-shadow:0 6px 24px #0004}
.settings-panel[hidden],.settings-panel [hidden]{display:none}
.settings-panel button{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:transparent;color:inherit;padding:10px 12px;text-align:left;font:inherit;font-size:14px;border-radius:5px;cursor:pointer}
.settings-panel button:hover{background:#ffffff18}.settings-title{padding:7px 12px;color:#d6e5de;font-size:12px}
@media(max-width:600px){.settings-panel{max-height:calc((100vw - 48px)*.69 - 80px)}}
.settings-panel [data-rate]{justify-content:flex-start;gap:10px}.settings-panel [data-rate]:before{content:"";width:16px}.settings-panel [aria-checked=true]:before{content:"✓"}

.links:target{outline:3px solid #e7b34d;outline-offset:12px;border-radius:5px}.links a:first-child{background:#206c5b;color:white;padding:12px 18px;border-radius:8px;text-decoration:none;font-weight:700}.links{align-items:center;scroll-margin-top:24px;display:flex;gap:20px;flex-wrap:wrap;margin-top:20px}a{color:#206c5b;text-underline-offset:4px}.note{font-size:13px}
</style>
</head>
<body><main>
<header><small>看護職員の勤務表作成支援アプリ</small><h1>勤務表作成の操作デモ</h1><p>中央の▶を押すと再生します。停止・音量・全画面は動画下部、再生速度は歯車の「設定」から変更できます。</p></header>
<div class="player">
<div class="video-surface">
<video id="demo" tabindex="0" controls playsinline preload="metadata" poster="demo/opening.png?v=d9fd87761bcb" aria-label="勤務表作成の操作デモ">
<source src="demo/walkthrough.mp4?v=d9fd87761bcb" type="video/mp4">動画を再生できない場合は、下のダウンロードをご利用ください。
</video>
<button class="play" id="play" aria-label="操作デモを再生" hidden></button>
<div class="player-settings" aria-label="動画の操作" hidden>
<input id="seek" class="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="再生位置">
<div class="control-row">
<button id="toggle-play" type="button" aria-label="再生">▶</button>
<button id="mute" type="button" aria-label="消音"><svg viewBox="0 0 24 24" width="23" height="23" aria-hidden="true"><path fill="currentColor" d="M3 9v6h4l5 4V5L7 9zm12-2v2a4 4 0 0 1 0 6v2a6 6 0 0 0 0-10zm3-3v2a8 8 0 0 1 0 12v2a10 10 0 0 0 0-16z"/></svg></button>
<input id="volume" class="volume" type="range" min="0" max="1" value="0.85" step="0.05" aria-label="音量">
<span class="timestamp" id="timestamp">0:00 / 0:00</span><span class="control-spacer"></span>
<button id="settings" class="settings-button" type="button" aria-label="動画の設定" aria-expanded="false" aria-controls="settings-panel"><svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="m20.3 13.4.1-1.4-.1-1.4 1.7-1.3-1.7-3-2 .8a8 8 0 0 0-2.4-1.4L15.6 3h-3.4l-.3 2.7a8 8 0 0 0-2.4 1.4l-2-.8-1.7 3 1.7 1.3-.1 1.4.1 1.4-1.7 1.3 1.7 3 2-.8a8 8 0 0 0 2.4 1.4l.3 2.7h3.4l.3-2.7a8 8 0 0 0 2.4-1.4l2 .8 1.7-3zM13.9 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7"/></svg></button>
<button id="fullscreen" type="button" aria-label="全画面"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M3 3h7v2H5v5H3zm11 0h7v7h-2V5h-5zM3 14h2v5h5v2H3zm16 0h2v7h-7v-2h5z"/></svg></button></div>
<div id="settings-panel" class="settings-panel" hidden>
<div id="settings-home"><button type="button" id="open-speeds"><span>再生速度</span><span><span id="speed-label">標準</span> ›</span></button></div>
<div id="settings-speeds" hidden><button type="button" id="settings-back">‹ 設定</button><div class="settings-title">再生速度</div><div role="menu" aria-label="再生速度">
<button type="button" role="menuitemradio" data-rate="0.75" aria-checked="false">0.75倍</button>
<button type="button" role="menuitemradio" data-rate="1" aria-checked="true">標準</button>
<button type="button" role="menuitemradio" data-rate="1.25" aria-checked="false">1.25倍</button>
<button type="button" role="menuitemradio" data-rate="1.5" aria-checked="false">1.5倍</button>
<button type="button" role="menuitemradio" data-rate="2" aria-checked="false">2倍</button>
</div></div></div></div>
</div></div>
<div class="links" id="try-app" tabindex="-1"><a href="https://nurse-scheduler-demo.onrender.com/?month=2026-11" target="_blank" rel="noopener noreferrer" title="別タブで開きます">アプリを別タブで開く ↗</a><a href="https://raw.githubusercontent.com/higakota/nurse-scheduler-demo/main/samples/sample_requests_2026-11.xlsx" download>サンプルExcelをダウンロード</a><a href="https://github.com/higakota/nurse-scheduler-demo">GitHubへ戻る</a><a href="demo/walkthrough.mp4" download>動画をダウンロード</a></div>
<p class="note">表示する人名・施設・勤務予定はすべて架空です。日本語の合成音声と字幕で操作を説明します。</p>
</main><script>

const video=document.getElementById("demo"),play=document.getElementById("play");
const player=document.querySelector(".player"),toggle=document.getElementById("toggle-play"),seek=document.getElementById("seek"),volume=document.getElementById("volume"),mute=document.getElementById("mute"),timestamp=document.getElementById("timestamp"),fullscreen=document.getElementById("fullscreen");
document.querySelector(".player-settings").hidden=false;play.hidden=false;video.controls=false;video.volume=Number(volume.value);
function togglePlayback(){if(video.paused)video.play().catch(()=>{play.hidden=false;player.classList.remove("is-playing");toggle.textContent="▶";toggle.setAttribute("aria-label","再生")});else video.pause()}
toggle.addEventListener("click",togglePlayback);
video.addEventListener("click",togglePlayback);
video.addEventListener("keydown",event=>{
 if(event.code==="Space"){event.preventDefault();togglePlayback()}
 else if(["ArrowLeft","ArrowRight"].includes(event.key)&&Number.isFinite(video.duration)){event.preventDefault();video.currentTime=Math.min(video.duration,Math.max(0,video.currentTime+(event.key==="ArrowRight"?5:-5)))}
});
function clock(t){if(!Number.isFinite(t))return "0:00";return Math.floor(t/60)+":"+String(Math.floor(t%60)).padStart(2,"0")}
function updateTime(){timestamp.textContent=clock(video.currentTime)+" / "+clock(video.duration);seek.value=video.duration?video.currentTime/video.duration*100:0;seek.setAttribute("aria-valuetext",clock(video.currentTime))}
video.addEventListener("timeupdate",updateTime);video.addEventListener("loadedmetadata",updateTime);
seek.addEventListener("input",()=>{if(Number.isFinite(video.duration))video.currentTime=Number(seek.value)/100*video.duration;updateTime()});
mute.addEventListener("click",()=>{video.muted=!video.muted});
volume.addEventListener("input",()=>{video.volume=Number(volume.value);video.muted=false});
video.addEventListener("volumechange",()=>{volume.value=video.muted?0:video.volume;mute.setAttribute("aria-label",video.muted||!video.volume?"消音を解除":"消音");mute.style.opacity=video.muted||!video.volume?".5":"1"});
fullscreen.addEventListener("click",async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(player.requestFullscreen)await player.requestFullscreen();else if(video.webkitEnterFullscreen)video.webkitEnterFullscreen()}catch{}});
document.addEventListener("fullscreenchange",()=>fullscreen.setAttribute("aria-label",document.fullscreenElement?"全画面を終了":"全画面"));

const settings=document.getElementById("settings"),panel=document.getElementById("settings-panel");
const home=document.getElementById("settings-home"),speeds=document.getElementById("settings-speeds");
const speedLabel=document.getElementById("speed-label");
function closeSettings(){panel.hidden=true;settings.setAttribute("aria-expanded","false")}
settings.addEventListener("click",()=>{
 const open=panel.hidden;panel.hidden=!open;settings.setAttribute("aria-expanded",String(open));
 home.hidden=false;speeds.hidden=true;
 if(open)document.getElementById("open-speeds").focus();
});
document.getElementById("open-speeds").addEventListener("click",()=>{
 home.hidden=true;speeds.hidden=false;
 speeds.querySelector('[aria-checked="true"]').focus();
});
document.getElementById("settings-back").addEventListener("click",()=>{
 home.hidden=false;speeds.hidden=true;document.getElementById("open-speeds").focus();
});
document.querySelectorAll("[data-rate]").forEach(button=>button.addEventListener("click",()=>{
 video.playbackRate=Number(button.dataset.rate);closeSettings();settings.focus();
}));
video.addEventListener("ratechange",()=>{
 const rate=video.playbackRate;speedLabel.textContent=rate===1?"標準":rate+"倍";
 document.querySelectorAll("[data-rate]").forEach(button=>button.setAttribute("aria-checked",String(Number(button.dataset.rate)===rate)));
});
document.addEventListener("click",event=>{if(!event.target.closest(".player-settings"))closeSettings()});
speeds.addEventListener("keydown",event=>{
 if(!["ArrowDown","ArrowUp","Home","End"].includes(event.key))return;
 const options=[...speeds.querySelectorAll("[data-rate]")],current=options.indexOf(document.activeElement);
 if(current<0)return;
 event.preventDefault();
 const next=event.key==="Home"?0:event.key==="End"?options.length-1:(current+(event.key==="ArrowDown"?1:-1)+options.length)%options.length;
 options[next].focus();
});
document.addEventListener("keydown",event=>{
 if(event.key==="Escape"&&!panel.hidden){closeSettings();settings.focus()}
});
play.addEventListener("click",()=>video.play().catch(()=>{play.hidden=false}));
video.addEventListener("play",()=>{play.hidden=true;player.classList.add("is-playing");toggle.textContent="❚❚";toggle.setAttribute("aria-label","一時停止");closeSettings()});
video.addEventListener("pause",()=>{play.hidden=false;player.classList.remove("is-playing");toggle.textContent="▶";toggle.setAttribute("aria-label","再生")});
video.addEventListener("ended",()=>{play.hidden=false;player.classList.remove("is-playing");toggle.textContent="▶";toggle.setAttribute("aria-label","再生")});
</script></body></html>
